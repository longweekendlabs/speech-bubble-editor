name: Build and Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platforms to build (choose one when correcting a platform-specific failure)"
        required: true
        default: all
        type: choice
        options: [all, windows, linux, macos]
      tag:
        description: "Existing tag to release, for example v4.5.0. Leave blank to build artifacts only."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: SpeechBubbleEditor

jobs:
  source:
    name: Source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(python -c 'import version; print(version.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Create source archives
        shell: bash
        run: |
          mkdir -p release
          git archive --format=zip \
            --output="release/${APP_NAME}-v${{ steps.version.outputs.version }}-source.zip" HEAD
          git archive --format=tar.gz \
            --output="release/${APP_NAME}-v${{ steps.version.outputs.version }}-source.tar.gz" HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: release/*
          if-no-files-found: error
          retention-days: 3

  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    name: Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg rpm fakeroot dpkg-dev \
            libegl1 libglib2.0-0 libgl1 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run page-editor tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -q test_manga_maker.py test_render_cache.py test_media_loading.py

      - name: Build Linux executable
        shell: bash
        run: |
          python create_icon.py
          python -m PyInstaller --clean --noconfirm speech_bubble.spec
          file dist/SpeechBubbleEditor/SpeechBubbleEditor
          python tools/check_bundle.py dist/SpeechBubbleEditor
          python tools/run_packaged_check.py dist/SpeechBubbleEditor/SpeechBubbleEditor build/frozen-smoke.json

      - name: Create portable tar.gz
        shell: bash
        run: |
          version="$(python -c 'import version; print(version.__version__)')"
          mkdir -p linux
          tar -czf "linux/SpeechBubbleEditor-v${version}-linux-x64.tar.gz" \
            -C dist SpeechBubbleEditor

      - name: Create AppImage
        shell: bash
        run: |
          version="$(python -c 'import version; print(version.__version__)')"
          curl -sSL \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -o appimagetool
          chmod +x appimagetool

          mkdir -p AppDir/usr/bin
          cp -a dist/SpeechBubbleEditor AppDir/usr/
          chmod +x AppDir/usr/SpeechBubbleEditor/SpeechBubbleEditor
          cp icons/icon.png AppDir/icon.png

          cat > AppDir/SpeechBubbleEditor.desktop <<'EOF'
          [Desktop Entry]
          Version=1.0
          Name=Speech Bubble Editor
          Comment=Create speech bubbles, comic pages, photo collages, and video edits
          Exec=SpeechBubbleEditor
          Icon=icon
          Terminal=false
          Type=Application
          Categories=Graphics;Photography;
          EOF

          cat > AppDir/AppRun <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "${HERE}/usr/SpeechBubbleEditor/SpeechBubbleEditor" "$@"
          EOF
          chmod +x AppDir/AppRun

          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool \
            --no-appstream AppDir \
            "linux/SpeechBubbleEditor-v${version}-x86_64.AppImage" \
          || APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool \
            AppDir "linux/SpeechBubbleEditor-v${version}-x86_64.AppImage"
          chmod +x "linux/SpeechBubbleEditor-v${version}-x86_64.AppImage"

      - name: Create DEB
        shell: bash
        run: |
          package="speech-bubble-editor"
          version="$(python -c 'import version; print(version.__version__)')"
          debdir="_deb/${package}_${version}_amd64"
          mkdir -p "${debdir}/DEBIAN" "${debdir}/usr/local/bin" \
            "${debdir}/usr/share/applications" "${debdir}/usr/share/pixmaps"
          mkdir -p "${debdir}/opt/speech-bubble-editor"
          cp -a dist/SpeechBubbleEditor/. "${debdir}/opt/speech-bubble-editor/"
          ln -s /opt/speech-bubble-editor/SpeechBubbleEditor \
            "${debdir}/usr/local/bin/SpeechBubbleEditor"
          install -m 644 icons/icon.png \
            "${debdir}/usr/share/pixmaps/${package}.png"

          cat > "${debdir}/usr/share/applications/${package}.desktop" <<EOF
          [Desktop Entry]
          Version=1.0
          Name=Speech Bubble Editor
          Comment=Create speech bubbles, comic pages, photo collages, and video edits
          Exec=/usr/local/bin/SpeechBubbleEditor
          Icon=${package}
          Terminal=false
          Type=Application
          Categories=Graphics;Photography;
          EOF

          cat > "${debdir}/DEBIAN/control" <<EOF
          Package: ${package}
          Version: ${version}
          Architecture: amd64
          Maintainer: Long Weekend Labs <2272935+longweekendlabs@users.noreply.github.com>
          Depends: xdg-desktop-portal
          Recommends: xdg-desktop-portal-gtk | xdg-desktop-portal-kde | xdg-desktop-portal-gnome
          Description: Speech Bubble Editor
           Create speech bubbles, comic pages, photo collages, and video edits.
           Python and Qt are bundled; file dialogs use the desktop portal.
          EOF

          dpkg-deb --build "${debdir}" \
            "linux/${package}_${version}_amd64.deb"

      - name: Create RPM
        shell: bash
        run: |
          package="speech-bubble-editor"
          version="$(python -c 'import version; print(version.__version__)')"
          stage="${PWD}/_rpm_stage"
          topdir="${PWD}/_rpmbuild"
          mkdir -p "${stage}/usr/local/bin" \
            "${stage}/usr/share/applications" "${stage}/usr/share/pixmaps"
          mkdir -p "${stage}/opt/speech-bubble-editor"
          cp -a dist/SpeechBubbleEditor/. "${stage}/opt/speech-bubble-editor/"
          ln -s /opt/speech-bubble-editor/SpeechBubbleEditor \
            "${stage}/usr/local/bin/SpeechBubbleEditor"
          install -m 644 icons/icon.png \
            "${stage}/usr/share/pixmaps/${package}.png"

          cat > "${stage}/usr/share/applications/${package}.desktop" <<EOF
          [Desktop Entry]
          Version=1.0
          Name=Speech Bubble Editor
          Comment=Create speech bubbles, comic pages, photo collages, and video edits
          Exec=/usr/local/bin/SpeechBubbleEditor
          Icon=${package}
          Terminal=false
          Type=Application
          Categories=Graphics;Photography;
          EOF

          mkdir -p "${topdir}"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cat > "${topdir}/SPECS/${package}.spec" <<EOF
          %global __os_install_post %{nil}
          %global debug_package %{nil}
          AutoReqProv: no
          Name:           ${package}
          Version:        ${version}
          Release:        1%{?dist}
          Summary:        Speech bubbles, comic pages, collages, and video edits
          License:        MIT
          BuildArch:      x86_64
          Requires:       xdg-desktop-portal
          Recommends:     (xdg-desktop-portal-gtk or xdg-desktop-portal-kde or xdg-desktop-portal-gnome)

          %description
          Speech Bubble Editor is a private desktop editor for speech bubbles,
          comic pages, photo collages, layered media, and video edits.

          %install
          mkdir -p %{buildroot}/usr/local/bin
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/pixmaps
          mkdir -p %{buildroot}/opt/speech-bubble-editor
          cp -a %{_app_src}/opt/speech-bubble-editor/. %{buildroot}/opt/speech-bubble-editor/
          cp -a %{_app_src}/usr/local/bin/SpeechBubbleEditor %{buildroot}/usr/local/bin/SpeechBubbleEditor
          install -m 644 %{_app_src}/usr/share/applications/${package}.desktop %{buildroot}/usr/share/applications/${package}.desktop
          install -m 644 %{_app_src}/usr/share/pixmaps/${package}.png %{buildroot}/usr/share/pixmaps/${package}.png

          %files
          /opt/speech-bubble-editor
          /usr/local/bin/SpeechBubbleEditor
          /usr/share/applications/${package}.desktop
          /usr/share/pixmaps/${package}.png
          EOF

          rpmbuild -bb \
            --define "_topdir ${topdir}" \
            --define "_app_src ${stage}" \
            --define "__strip /bin/true" \
            "${topdir}/SPECS/${package}.spec"
          find "${topdir}/RPMS" -name '*.rpm' -exec cp {} linux/ \;

      - name: Verify Linux packages
        shell: bash
        run: |
          ls -lh linux/
          test "$(find linux -maxdepth 1 -type f | wc -l)" -eq 4

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: linux/*
          if-no-files-found: error
          retention-days: 3

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Chocolatey's bin/ffmpeg.exe can be a launcher shim. Bundle the
          # actual standalone executable so video/audio works on a clean PC.
          $ffmpeg = Get-ChildItem "$env:ChocolateyInstall/lib/ffmpeg" -Filter ffmpeg.exe -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $ffmpeg) { throw "FFmpeg executable not found" }
          "SBE_FFMPEG=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run page-editor tests
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest -q test_manga_maker.py test_render_cache.py test_media_loading.py

      - name: Build Windows executable
        shell: pwsh
        run: |
          python create_icon.py
          python -m PyInstaller --clean --noconfirm speech_bubble.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = python -c "import version; print(version.__version__)"
          New-Item -ItemType Directory -Force -Path win | Out-Null
          python tools/check_bundle.py dist/SpeechBubbleEditor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run_packaged_check.py dist/SpeechBubbleEditor/SpeechBubbleEditor.exe build/frozen-smoke.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "dist/SpeechBubbleEditor" `
            -DestinationPath "win/SpeechBubbleEditor-v$version-windows-x64-portable.zip" `
            -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = python -c "import version; print(version.__version__)"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$version" `
            "/FSpeechBubbleEditor-v$version-win64-Setup" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "Output/SpeechBubbleEditor-v$version-win64-Setup.exe" `
            "win/SpeechBubbleEditor-v$version-win64-Setup.exe" -Force

      - name: Verify Windows packages
        shell: pwsh
        run: |
          Get-ChildItem win
          if ((Get-ChildItem win -File).Count -ne 2) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: win/*
          if-no-files-found: error
          retention-days: 3

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: arm64
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run editor tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -q test_manga_maker.py test_render_cache.py test_media_loading.py

      - name: Build and verify macOS app
        shell: bash
        run: |
          python -m PyInstaller --clean --noconfirm speech_bubble.spec
          python tools/check_bundle.py "dist/Speech Bubble Editor.app"
          python tools/run_packaged_check.py \
            "dist/Speech Bubble Editor.app/Contents/MacOS/SpeechBubbleEditor" build/frozen-smoke.json
          codesign --verify --deep --strict "dist/Speech Bubble Editor.app"

      - name: Create macOS disk image
        shell: bash
        run: |
          bash tools/package_macos.sh "dist/Speech Bubble Editor.app" mac

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: mac/*.dmg
          if-no-files-found: error
          retention-days: 3

  release:
    name: GitHub Release
    needs: [source, linux, windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease || false }}
        shell: bash
        run: |
          NOTES="Speech Bubble Editor ${TAG_NAME}: Windows setup and portable packages; Linux AppImage, DEB, RPM, and portable packages; Apple Silicon macOS DMG; plus source archives."
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
            gh release edit "$TAG_NAME" \
              --title "Speech Bubble Editor ${TAG_NAME}" \
              --notes "$NOTES" \
              --latest
          else
            prerelease_flag=""
            if [ "$PRERELEASE" = "true" ]; then
              prerelease_flag="--prerelease"
            fi
            gh release create "$TAG_NAME" release-assets/* \
              --title "Speech Bubble Editor ${TAG_NAME}" \
              --notes "$NOTES" \
              $prerelease_flag
          fi
